<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07110f">
<title>Betandplay Content Hub</title>
<style>
:root{--bg:#07100f;--surface:#0c1715;--surface2:#101d1a;--surface3:#14231f;--line:#22352f;--text:#f3f7f5;--muted:#8ea29b;--green:#35d49a;--green2:#20b77f;--blue:#5fa8ff;--amber:#f2b84b;--red:#ef6f6c;--r:12px;--shadow:0 18px 48px rgba(0,0,0,.28)}
*{box-sizing:border-box}html{background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{margin:0;background:radial-gradient(circle at 70% -10%,rgba(53,212,154,.08),transparent 28%),var(--bg);min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1540px;margin:auto;padding:0 22px 48px}
.topbar{height:58px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(7,16,15,.94);backdrop-filter:blur(14px);z-index:30;margin:0 -22px;padding:0 28px}.brand{display:flex;align-items:center;gap:11px;font-weight:900;letter-spacing:-.3px}.brandmark{width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,var(--green),#12885f);display:grid;place-items:center;color:#052019;font-weight:1000}.nav{display:flex;gap:5px}.navbtn{border:0;background:transparent;color:var(--muted);padding:9px 13px;border-radius:9px;font-weight:800}.navbtn.active,.navbtn:hover{background:var(--surface2);color:#fff}.navbtn.active{box-shadow:inset 0 -2px var(--green)}
.view{display:none}.view.active{display:block}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding:24px 2px 16px}.eyebrow{color:var(--green);font-size:11px;letter-spacing:1.4px;font-weight:900;text-transform:uppercase}.pagehead h1{margin:3px 0 2px;font-size:28px;letter-spacing:-.8px}.pagehead p{margin:0;color:var(--muted);font-size:13px}.updated{font-size:11px;color:var(--muted)}
.toolbar{display:grid;grid-template-columns:minmax(280px,1.5fr) 150px 190px 150px auto;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:9px;position:sticky;top:68px;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.16)}.control{height:40px;border:1px solid var(--line);background:#091411;color:var(--text);border-radius:9px;padding:0 11px;min-width:0;outline:none}.control:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(53,212,154,.12)}.search{padding-left:13px}.btn{min-height:38px;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:9px;padding:8px 12px;font-weight:850}.btn:hover{border-color:#3d5c53;background:var(--surface3)}.btn:focus-visible,.navbtn:focus-visible,.chip:focus-visible,.odd:focus-visible{outline:2px solid var(--green);outline-offset:2px}.btn.primary{background:var(--green);border-color:var(--green);color:#052119}.btn.primary:hover{background:#50dfa9}.btn.ghost{background:transparent}.btn.danger{color:#ffb3b0}.btn:disabled{opacity:.5;cursor:not-allowed}
.quickbar{display:flex;align-items:center;gap:7px;margin:10px 1px 14px;min-height:32px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 10px;font-size:11px;font-weight:850}.chip.active{background:#13342a;border-color:#28634e;color:#bff5df}.filterchips{display:flex;gap:6px;flex-wrap:wrap;margin-left:8px}.activechip{font-size:10px;border-radius:999px;background:#10211c;border:1px solid #28463c;color:#c6d6d0;padding:5px 8px}
.today-strip{display:grid;grid-template-columns:1.4fr repeat(3,.6fr);gap:8px;margin-bottom:14px}.today-main,.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}.today-main strong{display:block;font-size:15px}.today-main span,.stat span{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.8px;font-weight:800}.stat b{display:block;font-size:20px;margin-top:2px}
.comp{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:10px;overflow:hidden}.comphead{height:48px;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--line);background:#0a1513}.comphead button{border:0;background:none;color:inherit;padding:0}.comp-logo,.team-logo{display:grid;place-items:center;flex:0 0 auto;background:#0b1513;border:1px solid #2a3d37;overflow:hidden;color:#c8d5d1;font-weight:900}.comp-logo{width:34px;height:34px;border-radius:9px;font-size:9px}.team-logo{width:38px;height:38px;border-radius:10px;font-size:10px}.comp-logo img{max-width:28px;max-height:28px;width:auto;height:auto;object-fit:contain}.team-logo img{max-width:32px;max-height:32px;width:auto;height:auto;object-fit:contain}.compmeta{min-width:0;flex:1}.compname{font-size:12px;font-weight:950;letter-spacing:.2px}.compcount{font-size:10px;color:var(--muted);margin-top:2px}.collapse-comp{font-size:11px;color:var(--muted);padding:8px!important}.compbody.collapsed{display:none}
.event{display:grid;grid-template-columns:78px minmax(330px,1.35fr) minmax(280px,.9fr) auto;align-items:center;min-height:72px;border-bottom:1px solid #172722;transition:background .12s}.event:last-child{border-bottom:0}.event:hover,.event.selected{background:#0e1d19}.time{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px solid #172722}.time b{font-size:14px}.time small{font-size:9px;color:var(--muted);margin-top:2px}.match{display:grid;grid-template-columns:minmax(0,1fr) 26px minmax(0,1fr);gap:8px;align-items:center;padding:8px 14px}.team{display:flex;align-items:center;gap:8px;min-width:0;font-size:13px;font-weight:900}.team.away{justify-content:flex-end;text-align:right}.teamname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vs{font-size:9px;color:#63766f;text-align:center;font-weight:900}.odds{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 12px}.odd{border:1px solid #294139;background:#0a1613;color:var(--text);border-radius:8px;height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 9px;min-width:0}.odd span{font-size:9px;color:var(--muted)}.odd b{font-size:13px}.odd:hover{border-color:#3b6b5b;background:#10221c}.actions{display:flex;gap:6px;padding:8px 12px}.actions .btn{font-size:11px;white-space:nowrap}.editorial{font-size:9px;color:#ffd28b;background:#2b2213;border:1px solid #5b4720;padding:3px 6px;border-radius:999px;margin-left:6px}
.empty,.error{border:1px dashed #2b443b;border-radius:var(--r);padding:38px;text-align:center;color:var(--muted);background:rgba(12,23,21,.6)}.empty strong,.error strong{display:block;color:var(--text);font-size:15px;margin-bottom:5px}.error{border-color:#573b38}.skeleton{height:72px;border-bottom:1px solid #172722;background:linear-gradient(90deg,#0b1714 20%,#11231e 38%,#0b1714 56%);background-size:220% 100%;animation:shimmer 1.2s infinite}@keyframes shimmer{to{background-position:-220% 0}}
.drawerback{position:fixed;inset:0;background:rgba(0,0,0,.52);z-index:60;opacity:0;pointer-events:none;transition:.16s}.drawerback.open{opacity:1;pointer-events:auto}.drawer{position:absolute;right:0;top:0;height:100%;width:min(560px,94vw);background:#091310;border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(100%);transition:.18s;display:flex;flex-direction:column}.drawerback.open .drawer{transform:none}.drawerhead{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.drawerhead h2{font-size:18px;margin:2px 0}.drawerhead p{margin:0;color:var(--muted);font-size:11px}.drawerbody{padding:14px 18px 28px;overflow:auto}.marketgroup{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}.marketgroup summary{padding:10px 12px;font-size:12px;font-weight:900;background:var(--surface);cursor:pointer;list-style:none;display:flex;justify-content:space-between}.marketgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;padding:8px}.market{border:1px solid #263e36;background:#0d1b17;border-radius:8px;padding:8px 9px;display:flex;justify-content:space-between;gap:8px;font-size:11px}.market b{color:#9df0ce}.drawer-loading{display:grid;gap:8px}.drawer-loading div{height:56px;border-radius:9px;background:#10201b}
.modalback{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:70;display:none;align-items:flex-start;justify-content:center;padding:7vh 18px 40px;overflow:auto}.modalback.open{display:flex}.modal{width:min(1000px,100%);background:#091310;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}.modalhead{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:14px}.modalhead h2{font-size:18px;margin:0 0 3px}.modalhead p{font-size:11px;color:var(--muted);margin:0}.modalbody{padding:14px 18px}.gen-controls{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;margin-bottom:14px}.seg{display:flex;gap:4px;background:#07100e;padding:4px;border:1px solid var(--line);border-radius:9px}.seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:7px;border-radius:6px;font-size:11px;font-weight:850}.seg button.active{background:var(--surface3);color:#fff}.generated{border-top:1px solid var(--line);padding-top:13px}.genbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.genbar h3{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.8px}.post{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:8px;overflow:hidden}.posthead{display:flex;justify-content:space-between;align-items:center;padding:9px 11px;border-bottom:1px solid var(--line)}.posthead strong{font-size:12px}.posttools{display:flex;gap:5px}.postbody{padding:12px 14px;font-size:12px;line-height:1.55;white-space:pre-wrap}.post.collapsed .postbody,.post.collapsed .postfooter{display:none}.postfooter{display:flex;gap:6px;padding:0 12px 11px}.editarea{width:100%;min-height:220px;background:#07100e;color:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical}
.studio{max-width:980px;margin:28px auto}.studiohero{text-align:center;padding:26px 12px}.studiohero h1{font-size:28px;margin:0 0 6px}.studiohero p{color:var(--muted);font-size:13px}.studio-search{display:flex;gap:8px;max-width:720px;margin:18px auto}.studio-search input{flex:1}.explore{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}.explore button{padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:#fff;text-align:left;font-weight:900}.searchresults{margin-top:12px}.searchrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);margin-bottom:6px}.searchrow b{font-size:12px}.searchrow span{display:block;color:var(--muted);font-size:10px;margin-top:2px}
@media(max-width:1100px){.toolbar{grid-template-columns:1fr 140px 170px auto}.toolbar #countryFilter{display:none}.event{grid-template-columns:70px 1fr auto}.odds{grid-column:2}.actions{grid-column:3;grid-row:1/3;flex-direction:column}.today-strip{grid-template-columns:1fr repeat(3,.5fr)}}
@media(max-width:780px){.app{padding:0 12px 40px}.topbar{margin:0 -12px;padding:0 14px}.brand span:last-child{display:none}.toolbar{top:58px;grid-template-columns:1fr 1fr}.toolbar .search{grid-column:1/-1}.today-strip{grid-template-columns:1fr 1fr}.today-main{grid-column:1/-1}.event{grid-template-columns:60px 1fr}.match{padding-right:8px}.odds{grid-column:1/-1;border-top:1px solid #172722;padding:7px 9px}.actions{grid-column:1/-1;grid-row:auto;flex-direction:row;justify-content:flex-end;border-top:1px solid #172722}.comphead{height:44px}.gen-controls{grid-template-columns:1fr}.modalback{padding:12px}.explore{grid-template-columns:1fr}.pagehead{padding-top:16px}.pagehead h1{font-size:23px}}
@media(max-width:480px){.navbtn{padding:8px 9px;font-size:11px}.toolbar{grid-template-columns:1fr}.toolbar .search{grid-column:auto}.match{grid-template-columns:1fr 20px 1fr}.team{flex-direction:column;text-align:center;gap:4px}.team.away{flex-direction:column-reverse;text-align:center}.team-logo{width:34px;height:34px}.team-logo img{max-width:28px;max-height:28px}.actions .btn{flex:1}.quickbar{overflow:auto;flex-wrap:nowrap}.today-strip{grid-template-columns:1fr 1fr}.marketgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand"><div class="brandmark">B</div><span>Betandplay</span><span style="color:var(--muted);font-weight:700">Content Hub</span></div>
  <nav class="nav" aria-label="Main navigation">
    <button class="navbtn active" data-view="biggames">Big Games</button>
    <button class="navbtn" data-view="studio">Content Studio</button>
  </nav>
</header>

<main>
<section id="biggames" class="view active">
  <div class="pagehead">
    <div><div class="eyebrow">Sports editorial workstation</div><h1>Big Games</h1><p>Find what matters, check the market, create content.</p></div>
    <div class="updated" id="lastUpdated">Live odds</div>
  </div>
  <div class="toolbar" role="search">
    <input id="search" class="control search" aria-label="Search team player or competition" placeholder="Search team, player or competition…">
    <select id="sportFilter" class="control" aria-label="Sport"><option value="soccer">Football</option><option value="tennis">Tennis</option><option value="basketball">Basketball</option></select>
    <select id="competitionFilter" class="control" aria-label="Competition"><option value="all">All competitions</option></select>
    <select id="countryFilter" class="control" aria-label="Country"><option value="all">All countries</option></select>
    <button id="resetFilters" class="btn ghost">Reset filters</button>
  </div>
  <div class="quickbar" aria-label="Date filters">
    <button class="chip active" data-range="today">Today</button>
    <button class="chip" data-range="tomorrow">Tomorrow</button>
    <button class="chip" data-range="7">Next 7 days</button>
    <button class="chip" data-range="30">Next 30 days</button>
    <div id="activeFilters" class="filterchips"></div>
  </div>
  <div id="todayStrip" class="today-strip"></div>
  <div id="events"><div class="comp"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></div>
</section>

<section id="studio" class="view">
  <div class="studio">
    <div class="studiohero"><div class="eyebrow">Content Studio</div><h1>What do you want to create?</h1><p>Start with an event. We only show controls when they are useful.</p></div>
    <div class="studio-search"><input id="studioSearch" class="control" placeholder="Search event, team, player or competition…"><button id="studioSearchBtn" class="btn primary">Search</button></div>
    <div id="studioResults" class="searchresults"></div>
    <div class="explore"><button data-explore="soccer">⚽<br>Football</button><button data-explore="tennis">🎾<br>Tennis</button><button data-explore="basketball">🏀<br>Basketball</button></div>
  </div>
</section>
</main>
</div>

<div id="marketBack" class="drawerback" aria-hidden="true"><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="marketTitle"><div class="drawerhead"><div><div class="eyebrow">Markets</div><h2 id="marketTitle">Match markets</h2><p id="marketMeta"></p></div><button class="btn ghost closeDrawer" aria-label="Close markets">✕</button></div><div id="marketBody" class="drawerbody"></div></aside></div>

<div id="createBack" class="modalback" aria-hidden="true"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="createTitle"><div class="modalhead"><div><div class="eyebrow">Create content</div><h2 id="createTitle">Selected match</h2><p id="createMeta"></p></div><button class="btn ghost closeCreate" aria-label="Close content creator">✕</button></div><div class="modalbody">
  <div class="gen-controls">
    <div><label class="eyebrow">Channel</label><div class="seg" data-seg="channel"><button class="active">Telegram</button><button>Email</button><button>Push</button></div></div>
    <div><label class="eyebrow">Language</label><div class="seg" data-seg="language"><button class="active">EN</button><button>DE</button><button>IT</button><button>ES</button></div></div>
    <div><label class="eyebrow">Tone</label><div class="seg" data-seg="tone"><button class="active">Sports</button><button>Hype</button><button>Informative</button></div></div>
    <button id="generateSelected" class="btn primary">Generate 3 angles →</button>
  </div>
  <div id="generated"></div>
</div></section></div>

<script>
const state={events:[],range:"today",selected:null,lastSuccess:null};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const initials=n=>String(n||"").split(/\s+/).filter(Boolean).map(x=>x[0]).join("").slice(0,3).toUpperCase();
const localDate=iso=>new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Malta",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date(iso));
const dayLabel=iso=>new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Malta",weekday:"long",day:"2-digit",month:"short"}).format(new Date(iso));
const timeLabel=iso=>new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Malta",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date(iso));
const todayKey=()=>localDate(new Date().toISOString());
const tomorrowKey=()=>{const d=new Date();d.setDate(d.getDate()+1);return localDate(d.toISOString())};
function logo(url,name,cls){return '<span class="'+cls+'">'+(url?'<img src="'+esc(url)+'" alt="" loading="lazy" onerror="this.remove();this.parentElement.textContent=\''+esc(initials(name))+'\'">':esc(initials(name)))+'</span>'}
function teamLogo(e,name){const x=(e.teamLogos||[]).find(a=>a.name===name);return logo(x?.url,name,"team-logo")}
function competitionLogo(e){return logo(e.competitionLogo,e.competition,"comp-logo")}
function setView(id){$$(".navbtn").forEach(x=>x.classList.toggle("active",x.dataset.view===id));$$(".view").forEach(x=>x.classList.toggle("active",x.id===id));if(id==="biggames"&&!state.events.length)loadEvents()}
$$(".navbtn").forEach(b=>b.onclick=()=>setView(b.dataset.view));

function rangeOk(e){
 const k=localDate(e.startTime), now=Date.now(), t=new Date(e.startTime).getTime();
 if(state.range==="today")return k===todayKey();
 if(state.range==="tomorrow")return k===tomorrowKey();
 const days=Number(state.range);return t>=now&&t<=now+days*86400000;
}
function filtered(){
 const q=$("#search").value.trim().toLowerCase(), sport=$("#sportFilter").value, comp=$("#competitionFilter").value,country=$("#countryFilter").value;
 return state.events.filter(e=>(e.sportKey||"").toLowerCase()===sport&&rangeOk(e)&&(comp==="all"||e.competition===comp)&&(country==="all"||e.country===country)&&(!q||[e.title,e.competition,e.country,...(e.teamNames||[])].join(" ").toLowerCase().includes(q)));
}
function fillFilters(){
 const comps=[...new Set(state.events.map(e=>e.competition).filter(Boolean))].sort(), countries=[...new Set(state.events.map(e=>e.country).filter(Boolean))].sort();
 $("#competitionFilter").innerHTML='<option value="all">All competitions</option>'+comps.map(x=>'<option>'+esc(x)+'</option>').join("");
 $("#countryFilter").innerHTML='<option value="all">All countries</option>'+countries.map(x=>'<option>'+esc(x)+'</option>').join("");
}
function activeChips(){
 const a=[];a.push($("#sportFilter").selectedOptions[0]?.text||"Football");if($("#competitionFilter").value!=="all")a.push($("#competitionFilter").value);if($("#countryFilter").value!=="all")a.push($("#countryFilter").value);if($("#search").value.trim())a.push("Search: "+$("#search").value.trim());
 $("#activeFilters").innerHTML=a.map(x=>'<span class="activechip">'+esc(x)+'</span>').join("");
}
function todaySummary(list){
 const comps=new Set(list.map(e=>e.competition)),sports=new Set(list.map(e=>e.sportKey));const now=Date.now();const soon=list.filter(e=>new Date(e.startTime)-now>0&&new Date(e.startTime)-now<90*60000).length;
 $("#todayStrip").innerHTML='<div class="today-main"><span>'+esc(state.range==="today"?"Today":state.range==="tomorrow"?"Tomorrow":"Editorial view")+'</span><strong>'+esc(state.range==="today"?new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Malta",weekday:"long",day:"2-digit",month:"long"}).format(new Date()):"Upcoming big games")+'</strong></div><div class="stat"><span>Games</span><b>'+list.length+'</b></div><div class="stat"><span>Competitions</span><b>'+comps.size+'</b></div><div class="stat"><span>Starting soon</span><b>'+soon+'</b></div>';
}
function eventRow(e){
 const teams=(e.teamNames||[]).slice(0,2),h=teams[0]||e.title.split(" vs ")[0],a=teams[1]||e.title.split(" vs ")[1],od=(e.odds||[]).slice(0,3);const soon=new Date(e.startTime)-Date.now()>0&&new Date(e.startTime)-Date.now()<90*60000;
 return '<article class="event" tabindex="0" data-event="'+esc(e.id)+'"><div class="time"><b>'+esc(timeLabel(e.startTime))+'</b><small>CEST</small></div><div class="match"><button class="team filterTeam" data-team="'+esc(h)+'" aria-label="Filter '+esc(h)+'">'+teamLogo(e,h)+'<span class="teamname">'+esc(h)+'</span></button><span class="vs">VS</span><button class="team away filterTeam" data-team="'+esc(a)+'" aria-label="Filter '+esc(a)+'"><span class="teamname">'+esc(a)+'</span>'+teamLogo(e,a)+'</button></div><div class="odds">'+[0,1,2].map((i)=>'<button class="odd" aria-label="Odd '+(i===0?"1":i===1?"X":"2")+' '+esc(od[i]?.value||"unavailable")+'"><span>'+(i===0?"1":i===1?"X":"2")+'</span><b>'+esc(od[i]?.value||"—")+'</b></button>').join("")+'</div><div class="actions">'+(soon?'<span class="editorial">⚡ Soon</span>':'')+'<button class="btn markets" data-id="'+esc(e.id)+'">View Markets</button><button class="btn primary create" data-id="'+esc(e.id)+'">Create Content →</button></div></article>';
}
function render(){
 const list=filtered();activeChips();todaySummary(list);
 if(!list.length){$("#events").innerHTML='<div class="empty"><strong>No matches found</strong>Try removing some filters.<br><button class="btn primary" style="margin-top:12px" id="emptyReset">Reset filters</button></div>';$("#emptyReset").onclick=reset;return}
 const groups=new Map();for(const e of list){if(!groups.has(e.competition))groups.set(e.competition,[]);groups.get(e.competition).push(e)}
 $("#events").innerHTML=[...groups.entries()].map(([name,items])=>{const e=items[0];return '<section class="comp"><header class="comphead">'+competitionLogo(e)+'<button class="compmeta filterComp" data-comp="'+esc(name)+'"><div class="compname">'+esc(name)+'</div><div class="compcount">'+items.length+' match'+(items.length===1?"":"es")+'</div></button><button class="collapse-comp" aria-label="Collapse '+esc(name)+'">Collapse</button></header><div class="compbody">'+items.map(eventRow).join("")+'</div></section>'}).join("");
 bindRows();
}
function bindRows(){
 $$(".collapse-comp").forEach(b=>b.onclick=()=>{const body=b.closest(".comp").querySelector(".compbody");body.classList.toggle("collapsed");b.textContent=body.classList.contains("collapsed")?"Expand":"Collapse"});
 $$(".filterComp").forEach(b=>b.onclick=()=>{$("#competitionFilter").value=b.dataset.comp;render()});
 $$(".filterTeam").forEach(b=>b.onclick=e=>{e.stopPropagation();$("#search").value=b.dataset.team;render()});
 $$(".markets").forEach(b=>b.onclick=e=>{e.stopPropagation();openMarkets(b.dataset.id)});
 $$(".create").forEach(b=>b.onclick=e=>{e.stopPropagation();openCreate(b.dataset.id)});
 $$(".event").forEach(row=>{row.onclick=e=>{if(e.target.closest("button"))return;state.selected=state.events.find(x=>String(x.id)===row.dataset.event);row.classList.add("selected")};row.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();openCreate(row.dataset.event)}}});
}
async function loadEvents(){
 $("#events").innerHTML='<div class="comp">'+Array(6).fill('<div class="skeleton"></div>').join("")+'</div>';
 try{const r=await fetch("/api/big-events",{cache:"no-store"}),d=await r.json();if(!r.ok)throw new Error(d.error||"api_error");state.events=d.events||[];state.lastSuccess=new Date();$("#lastUpdated").textContent="Updated "+new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Malta",hour:"2-digit",minute:"2-digit"}).format(state.lastSuccess)+" CEST";fillFilters();render()}
 catch(e){$("#events").innerHTML='<div class="error"><strong>Live odds are temporarily unavailable</strong>'+(state.lastSuccess?"Last successful update: "+state.lastSuccess.toLocaleTimeString():"Could not reach the sportsbook API.")+'<br><button class="btn primary" id="retry" style="margin-top:12px">Retry</button></div>';$("#retry").onclick=loadEvents}
}
function reset(){$("#search").value="";$("#sportFilter").value="soccer";$("#competitionFilter").value="all";$("#countryFilter").value="all";state.range="today";$$("[data-range]").forEach(x=>x.classList.toggle("active",x.dataset.range==="today"));render()}
$("#resetFilters").onclick=reset;["search","sportFilter","competitionFilter","countryFilter"].forEach(id=>$("#"+id).addEventListener(id==="search"?"input":"change",render));$$("[data-range]").forEach(b=>b.onclick=()=>{state.range=b.dataset.range;$$("[data-range]").forEach(x=>x.classList.toggle("active",x===b));render()});

function eventById(id){return state.events.find(e=>String(e.id)===String(id))}
function openDrawer(back){back.classList.add("open");back.setAttribute("aria-hidden","false")}
function closeDrawer(back){back.classList.remove("open");back.setAttribute("aria-hidden","true")}
async function openMarkets(id){
 const e=eventById(id);if(!e)return;$("#marketTitle").textContent=e.title;$("#marketMeta").textContent=e.competition+" · "+dayLabel(e.startTime)+" · "+timeLabel(e.startTime)+" CEST";$("#marketBody").innerHTML='<div class="drawer-loading"><div></div><div></div><div></div><div></div></div>';openDrawer($("#marketBack"));
 try{const r=await fetch("/api/match-markets/"+encodeURIComponent(id),{cache:"no-store"}),d=await r.json();if(!r.ok)throw new Error(d.error||"markets_error");const groups=d.groups||[];$("#marketBody").innerHTML=groups.length?groups.map((g,i)=>'<details class="marketgroup" '+(i<4?"open":"")+'><summary><span>'+esc(g.name)+'</span><span>'+g.markets.reduce((n,m)=>n+m.selections.length,0)+' selections</span></summary><div class="marketgrid">'+g.markets.flatMap(m=>m.selections.map(s=>'<div class="market"><span>'+esc(s.label)+'</span><b>'+esc(s.value)+'</b></div>')).join("")+'</div></details>').join(""):'<div class="empty"><strong>No additional markets</strong>Only the main market is currently available.</div>'}
 catch(err){$("#marketBody").innerHTML='<div class="error"><strong>Markets unavailable</strong>Try again in a moment.</div>'}
}
$(".closeDrawer").onclick=()=>closeDrawer($("#marketBack"));$("#marketBack").onclick=e=>{if(e.target===e.currentTarget)closeDrawer(e.currentTarget)};

function openCreate(id){const e=eventById(id);if(!e)return;state.selected=e;$("#createTitle").textContent=e.title;$("#createMeta").textContent=e.competition+" · "+dayLabel(e.startTime)+" · "+timeLabel(e.startTime)+" CEST";$("#generated").innerHTML="";openDrawer($("#createBack"))}
$(".closeCreate").onclick=()=>closeDrawer($("#createBack"));$("#createBack").onclick=e=>{if(e.target===e.currentTarget)closeDrawer(e.currentTarget)};
$$(".seg button").forEach(b=>b.onclick=()=>{b.parentElement.querySelectorAll("button").forEach(x=>x.classList.remove("active"));b.classList.add("active")});
function postCard(v,i){return '<article class="post" data-post="'+i+'"><header class="posthead"><strong>OPTION '+(i+1)+' · '+esc(v.contentType||"CONTENT")+'</strong><div class="posttools"><button class="btn collapsePost">Collapse</button></div></header><div class="postbody">'+esc(v.copy||"")+'</div><footer class="postfooter"><button class="btn primary copyPost">Copy</button><button class="btn editPost">Edit</button></footer></article>'}
$("#generateSelected").onclick=async()=>{
 if(!state.selected)return;const b=$("#generateSelected");b.disabled=true;b.textContent="Creating 3 content angles…";$("#generated").innerHTML='<div class="generated"><div class="empty"><strong>Creating 3 content angles for '+esc(state.selected.title)+'…</strong>Checking match markets and preparing different editorial approaches.</div></div>';
 try{const r=await fetch("/api/generate-variants",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({matchId:state.selected.id})}),d=await r.json();if(!r.ok)throw new Error(d.error||"generation_error");$("#generated").innerHTML='<div class="generated"><div class="genbar"><h3>Generated content</h3><div><button class="btn" id="collapseAll">Collapse all</button> <button class="btn" id="expandAll">Expand all</button></div></div>'+(d.variants||[]).map(postCard).join("")+'</div>';bindPosts(d.variants||[])}
 catch(err){$("#generated").innerHTML='<div class="error"><strong>Could not generate content</strong>'+esc(err.message)+'</div>'}
 finally{b.disabled=false;b.textContent="Generate 3 angles →"}
};
function bindPosts(vars){$("#collapseAll").onclick=()=>$$(".post").forEach(x=>x.classList.add("collapsed"));$("#expandAll").onclick=()=>$$(".post").forEach(x=>x.classList.remove("collapsed"));$$(".collapsePost").forEach(b=>b.onclick=()=>{const p=b.closest(".post");p.classList.toggle("collapsed");b.textContent=p.classList.contains("collapsed")?"Expand":"Collapse"});$$(".copyPost").forEach((b,i)=>b.onclick=async()=>{const body=b.closest(".post").querySelector(".postbody");await navigator.clipboard.writeText(body.textContent);const old=b.textContent;b.textContent="✓ Copied";setTimeout(()=>b.textContent=old,1200)});$$(".editPost").forEach((b,i)=>b.onclick=()=>{const p=b.closest(".post"),body=p.querySelector(".postbody");if(body.querySelector("textarea"))return;const t=document.createElement("textarea");t.className="editarea";t.value=body.textContent;body.textContent="";body.appendChild(t);t.focus();b.textContent="Done";b.onclick=()=>{body.textContent=t.value;b.textContent="Edit";bindPosts(vars)}})}
async function studioSearch(){const q=$("#studioSearch").value.trim();if(q.length<2){$("#studioResults").innerHTML='<div class="empty"><strong>Start typing</strong>Enter at least 2 characters.</div>';return}$("#studioResults").innerHTML='<div class="skeleton"></div>';try{const r=await fetch("/api/search-matches?q="+encodeURIComponent(q),{cache:"no-store"}),d=await r.json();const m=d.matches||[];$("#studioResults").innerHTML=m.length?m.map(x=>'<div class="searchrow"><div><b>'+esc(x.title)+'</b><span>'+esc(x.competition)+' · '+esc(x.time)+'</span></div><button class="btn primary studioCreate" data-id="'+esc(x.id)+'">Create Content →</button></div>').join(""):'<div class="empty"><strong>No upcoming matches found</strong>Try another team or competition.</div>';$$(".studioCreate").forEach(b=>b.onclick=()=>{let e=eventById(b.dataset.id);if(!e){e=m.find(x=>String(x.id)===b.dataset.id);state.events.push(e)}openCreate(b.dataset.id)})}catch{$("#studioResults").innerHTML='<div class="error"><strong>Search unavailable</strong>Try again.</div>'}}
$("#studioSearchBtn").onclick=studioSearch;$("#studioSearch").onkeydown=e=>{if(e.key==="Enter")studioSearch()};$$("[data-explore]").forEach(b=>b.onclick=()=>{setView("biggames");$("#sportFilter").value=b.dataset.explore;state.range="30";$$("[data-range]").forEach(x=>x.classList.toggle("active",x.dataset.range==="30"));render()});

document.addEventListener("keydown",e=>{const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);if(e.key==="Escape"){closeDrawer($("#marketBack"));closeDrawer($("#createBack"));return}if(typing)return;if(e.key==="/"){e.preventDefault();$("#search").focus()}if(e.key.toLowerCase()==="g"&&state.selected)openCreate(state.selected.id)});
loadEvents();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Betandplay Content Hub V2</title>
<style>
:root{--bg:#080a0f;--panel:#11151d;--panel2:#171c26;--text:#f5f7fb;--muted:#96a0b2;--accent:#7c5cff;--accent2:#278cff;--line:#242b38}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#17102f 0,#080a0f 34%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:1180px;margin:auto;padding:28px 18px 60px}header{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;margin-bottom:24px}
h1{margin:0;font-size:30px}p{color:var(--muted)}.badge{padding:9px 12px;border:1px solid var(--line);border-radius:999px;background:#0d1118;color:#c5ccda;font-size:12px}
.generator{display:grid;grid-template-columns:2fr 2fr 1fr auto;gap:10px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:22px}
select,button{border:1px solid var(--line);background:#0e131b;color:var(--text);border-radius:12px;padding:12px 13px;font-weight:700}
button{cursor:pointer}.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:20px;padding:18px}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pill{font-size:12px;padding:7px 9px;border-radius:999px;border:1px solid var(--line);background:#0c1118;color:#c5ccda}.title{font-size:20px;font-weight:800;margin:12px 0}
.odds{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.odd{padding:8px 10px;border-radius:10px;background:#0b0f16;border:1px solid #2a3240;font-size:13px}
.copy{white-space:pre-wrap;background:#0b0f15;border:1px solid var(--line);padding:14px;border-radius:14px;line-height:1.45;font-size:14px}.actions{display:flex;gap:10px;margin-top:14px}
.empty{padding:50px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px;grid-column:1/-1}
.note{margin:0 0 16px;color:var(--muted);font-size:13px}
@media(max-width:760px){.generator{grid-template-columns:1fr}.grid{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>Betandplay Content Hub V2</h1>
    <p>On-demand content generation with live sportsbook odds.</p>
  </div>
  <div class="badge">LOW-COST MODE</div>
</header>

<p class="note">No background polling. The app only contacts Betandplay when you press Generate.</p>

<div class="generator">
  <select id="tournament">
    <option value="all">All tournaments / Best available</option>
    <optgroup label="UEFA">
      <option value="champions">UEFA Champions League</option>
      <option value="europa">UEFA Europa League</option>
      <option value="conference">UEFA Conference League</option>
      <option value="nations">UEFA Nations League</option>
    </optgroup>
    <optgroup label="Top leagues">
      <option value="premier">Premier League</option>
      <option value="bundesliga">Bundesliga</option>
      <option value="seriea">Serie A</option>
      <option value="laliga">LaLiga</option>
      <option value="ligue1">Ligue 1</option>
    </optgroup>
    <optgroup label="Cups">
      <option value="facup">FA Cup</option>
      <option value="carabao">Carabao Cup</option>
      <option value="dfbpokal">DFB-Pokal</option>
    </optgroup>
  </select>

  <select id="contentType">
    <option value="match">Match Spotlight</option>
    <option value="tournament">Tournament Preview</option>
    <option value="acca">Tournament ACCA</option>
    <option value="picks">Today's Picks</option>
    <option value="weekend">Weekend Preview</option>
  </select>

  <select id="count">
    <option value="1">1 post</option>
    <option value="3" selected>3 posts</option>
    <option value="5">5 posts</option>
  </select>

  <button id="generate" class="primary">✨ GENERATE</button>
</div>

<div id="grid" class="grid"><div class="empty">Choose your settings and generate content.</div></div>
</div>

<script>
const grid=document.getElementById("grid");
const btn=document.getElementById("generate");

function esc(v){
  return String(v??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll(String.fromCharCode(34),"&quot;")
    .replaceAll("'","&#39;");
}

function render(posts){
  if(!posts.length){
    grid.innerHTML='<div class="empty">No suitable events were found for that selection.</div>';
    return;
  }

  grid.innerHTML=posts.map((p,index)=>{
    const odds=(p.odds||[]).map(o=>'<span class="odd">'+esc(o.label)+' <b>'+esc(o.value)+'</b></span>').join("");
    return '<article class="card">'+
      '<div class="top"><span class="pill">'+esc(p.contentType||"Content")+'</span><span class="pill">'+esc(p.competition||"")+'</span><span class="pill">'+esc(p.time||"")+'</span></div>'+
      '<div class="title">'+esc(p.title||"")+'</div>'+
      '<div class="odds">'+odds+'</div>'+
      '<div class="copy">'+esc(p.copy||"")+'</div>'+
      '<div class="actions"><button class="primary" data-copy="'+index+'">COPY POST</button></div>'+
    '</article>';
  }).join("");

  document.querySelectorAll("[data-copy]").forEach(el=>{
    el.onclick=async()=>{
      const p=posts[Number(el.dataset.copy)];
      await navigator.clipboard.writeText(p.copy||"");
      const old=el.textContent;
      el.textContent="COPIED ✓";
      setTimeout(()=>el.textContent=old,1200);
    };
  });
}

btn.onclick=async()=>{
  const old=btn.textContent;
  btn.textContent="Generating…";
  btn.disabled=true;
  try{
    const r=await fetch("/api/generate",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        tournamentKey:document.getElementById("tournament").value,
        contentType:document.getElementById("contentType").value,
        count:Number(document.getElementById("count").value||3),
        excludeGermany:true
      })
    });
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||"generation_failed");
    render(d.posts||[]);
  }catch(e){
    grid.innerHTML='<div class="empty">Generation failed: '+esc(e.message)+'</div>';
  }finally{
    btn.textContent=old;
    btn.disabled=false;
  }
};
</script>
</body>
</html>

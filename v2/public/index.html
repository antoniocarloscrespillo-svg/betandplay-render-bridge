<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Betandplay Sports Content Hub V2</title>
<style>
:root{
  --bg:#060810;--panel:#10151f;--panel2:#171d2a;--text:#f7f9fc;--muted:#96a4ba;
  --purple:#7b5cff;--blue:#2f8cff;--cyan:#16d0d8;--green:#32d583;--amber:#ffbe45;
  --red:#ff586a;--pink:#ec6cff;--orange:#ff7a45;--lime:#9bd83b;--gold:#ffd45e;
  --teal:#27d7b0;--indigo:#6673ff;--line:#263042;
}
*{box-sizing:border-box}
body{margin:0;background:
radial-gradient(circle at 88% 0%,rgba(124,92,255,.25),transparent 24%),
radial-gradient(circle at 8% 18%,rgba(39,140,255,.18),transparent 24%),
radial-gradient(circle at 50% 55%,rgba(24,200,216,.07),transparent 30%),
var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
button,select{font:inherit}
.shell{max-width:none;margin:0;padding:0 20px 48px}
header{display:none}
.brandline{display:flex;gap:10px;align-items:center}
.logo{width:50px;height:50px;border-radius:16px;background:linear-gradient(135deg,var(--purple),var(--blue) 45%,var(--cyan));display:grid;place-items:center;font-weight:900;box-shadow:0 12px 30px rgba(79,92,255,.3)}
h1{margin:0;font-size:28px;letter-spacing:-.6px}.sub{margin:5px 0 0;color:var(--muted);font-size:14px}
.status{font-size:12px;padding:8px 11px;border:1px solid rgba(50,213,131,.3);background:rgba(50,213,131,.08);color:#8ef0b7;border-radius:999px}
.tabs{display:flex;gap:8px;margin:0 -20px;padding:10px 24px;border-bottom:1px solid #14283a;background:linear-gradient(180deg,#07121c,#08101a);position:sticky;top:0;z-index:20}.tab{border:1px solid #20384d;background:#07101a;color:#d6e0ee;padding:10px 15px;border-radius:12px;font-weight:850;cursor:pointer;font-size:13px}.tab.active{color:#fff;background:linear-gradient(135deg,#5b56ff,#138ce8 62%,#15c7d8);border-color:transparent;box-shadow:0 8px 24px rgba(33,113,255,.28)}
.panel{display:none}.panel.active{display:block}
.generator{display:grid;grid-template-columns:2fr 2fr 1fr auto;gap:10px;background:linear-gradient(180deg,#171c26,#11151d);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:18px}
.searchbox{display:grid;grid-template-columns:1fr auto;gap:10px;background:linear-gradient(135deg,rgba(47,140,255,.16),rgba(124,92,255,.12),rgba(24,200,216,.08));border:1px solid #30405a;border-radius:20px;padding:16px;margin-bottom:18px}
.searchbox input{border:1px solid var(--line);background:#0d1219;color:var(--text);border-radius:12px;padding:13px 14px;font:inherit;font-weight:700;outline:none}
.searchbox input:focus{border-color:#4b79ff;box-shadow:0 0 0 3px rgba(47,140,255,.12)}
.search-results{display:grid;gap:10px;margin-bottom:18px}
.search-result{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:8px 10px;background:linear-gradient(145deg,#141a25,#0d1219)}
.search-main{display:grid;gap:5px}.search-title{font-weight:900}.search-meta{font-size:12px;color:var(--muted)}
select,.btn{border:1px solid var(--line);background:#0d1219;color:var(--text);border-radius:12px;padding:12px 13px;font-weight:750}.btn{cursor:pointer}.primary{border:0;background:linear-gradient(135deg,var(--purple),var(--blue),var(--cyan));box-shadow:0 8px 22px rgba(74,92,255,.28)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{background:linear-gradient(180deg,#171c26,#11151d);border:1px solid var(--line);border-radius:20px;padding:18px;overflow:hidden;position:relative}
.card:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--purple),var(--blue),var(--cyan),var(--green))}
.top{display:flex;justify-content:space-between;gap:9px;flex-wrap:wrap}.pill{font-size:11px;padding:7px 9px;border-radius:999px;background:#0c1118;border:1px solid var(--line);color:#c8cfdb}.title{font-size:20px;font-weight:850;margin:13px 0}.odds{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.odd{padding:8px 10px;border-radius:10px;background:#0b0f16;border:1px solid #2a3240;font-size:13px}.copy{background:linear-gradient(180deg,#0b1018,#090d13);border:1px solid var(--line);padding:16px;border-radius:14px;line-height:1.62;font-size:14px;color:#e7edf7}
.copy strong{color:#fff;font-weight:900}
.copy .copy-heading{display:block;margin:10px 0 6px;font-size:12px;letter-spacing:.75px;text-transform:uppercase;color:#7fc7ff;font-weight:900}
.copy .copy-bullet{display:block;margin:3px 0;padding-left:2px}
.copy .copy-cta{display:block;margin-top:12px;padding:10px 12px;border-radius:10px;background:linear-gradient(135deg,rgba(123,92,255,.16),rgba(47,140,255,.14));border:1px solid #30415d;color:#fff;font-weight:900}.actions{display:flex;gap:10px;margin-top:14px}
.empty{padding:54px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px;grid-column:1/-1}
.report-head{display:grid;grid-template-columns:1.6fr .8fr;gap:16px;margin-bottom:16px}
.hero{min-height:220px;border:1px solid var(--line);border-radius:24px;padding:24px;background:
linear-gradient(145deg,rgba(124,92,255,.9),rgba(39,140,255,.62) 55%,rgba(24,200,216,.25)),
#11151d;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;position:relative}
.hero:after{content:"";position:absolute;width:230px;height:230px;border:35px solid rgba(255,255,255,.07);border-radius:50%;right:-55px;top:-65px}
.hero-kicker{font-size:12px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;opacity:.8}.hero-title{font-size:34px;line-height:1.02;font-weight:900;max-width:620px;letter-spacing:-1px}.hero-meta{display:flex;gap:8px;flex-wrap:wrap}.hero-chip{font-size:12px;padding:8px 10px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.16);border-radius:999px}
.side-stack{display:grid;grid-template-columns:1fr;gap:12px}.metric{border-radius:20px;padding:18px;border:1px solid var(--line);background:#11151d}.metric:nth-child(1){background:linear-gradient(135deg,rgba(50,213,131,.22),#11151d)}.metric:nth-child(2){background:linear-gradient(135deg,rgba(247,184,75,.22),#11151d)}.metric:nth-child(3){background:linear-gradient(135deg,rgba(236,108,255,.18),#11151d)}.metric .big{font-size:32px;font-weight:900;margin-top:8px}.metric span{color:var(--muted);font-size:12px}
.report-toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:8px 0 16px}.report-title h2{margin:0;font-size:22px}.report-title p{margin:4px 0 0;color:var(--muted);font-size:13px}
.competitions{display:grid;gap:14px}.competition{border:1px solid var(--line);border-radius:20px;background:#10141b;overflow:hidden}.comp-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 17px;border-bottom:1px solid var(--line)}.comp-title{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:900}.dot{width:10px;height:10px;border-radius:50%}.matches{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0}.match{padding:15px 17px;border-bottom:1px solid #1d2430}.match:nth-child(odd){border-right:1px solid #1d2430}.match-name{font-weight:800;margin-bottom:7px}.match-time{font-size:12px;color:var(--muted);margin-bottom:10px}.mini-odds{display:flex;gap:6px;flex-wrap:wrap}.mini{font-size:11px;padding:6px 8px;border-radius:8px;background:#0a0f15;border:1px solid #26303d}
.c-champions .dot{background:var(--blue)}.c-europa .dot{background:var(--amber)}.c-conference .dot{background:var(--green)}.c-premier .dot{background:var(--pink)}.c-bundesliga .dot{background:var(--red)}.c-seriea .dot{background:var(--cyan)}.c-laliga .dot{background:var(--orange)}.c-ligue1 .dot{background:#8f7cff}.c-facup .dot{background:#58d6ff}.c-carabao .dot{background:#a66cff}.c-copa_del_rey .dot{background:#ff9d3f}.c-coppa_italia .dot{background:#36c7a8}.c-dfbpokal .dot{background:#ff6868}.c-nations .dot{background:var(--gold)}.c-australianopen .dot{background:#4aa3ff}.c-rolandgarros .dot{background:#d9894d}.c-wimbledon .dot{background:#8a6be8}.c-usopen .dot{background:#3bd5a0}.c-other .dot{background:#778297}

.monthly-overview{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
.month-card{border:1px solid var(--line);border-radius:18px;padding:16px;background:linear-gradient(145deg,#151b28,#0e131c)}
.month-card:nth-child(4n+1){background:linear-gradient(145deg,rgba(47,140,255,.18),#10151f)}
.month-card:nth-child(4n+2){background:linear-gradient(145deg,rgba(236,108,255,.16),#10151f)}
.month-card:nth-child(4n+3){background:linear-gradient(145deg,rgba(50,213,131,.16),#10151f)}
.month-card:nth-child(4n+4){background:linear-gradient(145deg,rgba(255,190,69,.16),#10151f)}
.month-week{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.8px}
.month-range{font-size:14px;font-weight:900;margin:6px 0 12px}
.month-events{font-size:30px;font-weight:900}

.timeline{display:grid;gap:10px;margin:16px 0 22px}
.day-row{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:start;border:1px solid var(--line);background:#0d1219;border-radius:15px;padding:12px}
.day-label{font-weight:900;color:#dfe6f3}.day-events{display:flex;gap:7px;flex-wrap:wrap}
.day-chip{font-size:11px;padding:7px 9px;border-radius:999px;background:linear-gradient(135deg,rgba(124,92,255,.16),rgba(47,140,255,.12));border:1px solid #2c3850;color:#dfe7f7}
.report-period-badge{display:inline-flex;padding:7px 10px;border-radius:999px;background:linear-gradient(135deg,rgba(124,92,255,.18),rgba(24,200,216,.14));border:1px solid #33425c;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.8px}
.biggames-hero-ref{margin:0 -28px 14px;min-height:190px;background:
linear-gradient(90deg,rgba(3,11,18,.82) 0%,rgba(3,11,18,.32) 31%,rgba(3,11,18,.05) 58%,rgba(3,11,18,.38) 100%),
url('/big-games-hero.svg') center/cover no-repeat;border-bottom:1px solid #173147;display:flex;align-items:flex-end;padding:20px 34px;position:relative}
.biggames-copy{max-width:520px;padding-bottom:6px}.biggames-kicker{font-size:14px;font-weight:800;letter-spacing:2px;color:#d9e6f4;margin-bottom:6px}
.biggames-heading{font-size:38px;font-weight:950;line-height:.95;margin:0;letter-spacing:-1.8px}.biggames-heading span{color:#159fe8}
.biggames-sub{margin:7px 0 12px;color:#b6c5d8;font-size:13px}
.biggames-sportnav{display:flex;gap:14px;flex-wrap:wrap}.sportnav-btn{border:1px solid #2a4057;background:#07121d;color:#dfe8f4;border-radius:999px;padding:7px 14px;font-weight:850;cursor:pointer}.sportnav-btn.active{background:linear-gradient(135deg,#1268ff,#19c7de);border-color:transparent;color:white}
.biggames-toolbar{display:grid;grid-template-columns:minmax(300px,1.55fr) .85fr .95fr .95fr auto;gap:14px;margin:0 0 16px;padding:10px;background:linear-gradient(180deg,#0a151f,#08111a);border:1px solid #14293c;border-radius:18px;box-shadow:0 12px 26px rgba(0,0,0,.18)}
.big-filter,.big-search{height:44px;border:1px solid #294158!important;background:#08131e!important;color:#f5f8fc!important;border-radius:13px!important;padding:0 12px!important;font:inherit;font-weight:750;outline:none;min-width:0}
.big-search::placeholder{color:#8ea2b7}.big-filter:focus,.big-search:focus{border-color:#2b8fe8!important;box-shadow:0 0 0 3px rgba(43,143,232,.12)}
.reset-blue{height:52px;padding:0 15px!important;background:linear-gradient(135deg,#1475ff,#17b4e4)!important;border:0!important;color:#fff!important;border-radius:13px!important;font-weight:850!important;white-space:nowrap}
.big-day{margin-bottom:26px}.big-day-title{display:flex;justify-content:space-between;align-items:center;margin:0 6px 10px}.big-day-title h3{margin:0;font-size:20px;letter-spacing:.3px;display:flex;align-items:center;gap:10px}.big-day-title h3:before{content:"▣";font-size:16px;color:#dfe9f5}.big-day-title .pill{background:none;border:0;color:#7f94ac;font-size:13px}
.big-competition{border:1px solid #1d3448;border-radius:18px;overflow:hidden;background:#08111a;margin-bottom:13px;box-shadow:0 12px 28px rgba(0,0,0,.16)}
.big-competition-head{display:none}
.big-event-list{display:grid;grid-template-columns:1fr}
.big-event{display:grid;grid-template-columns:115px minmax(300px,1.35fr) 280px auto;gap:0;align-items:stretch;padding:0;border-bottom:1px solid #162c3d;background:linear-gradient(90deg,#08111a,#091521)}
.big-event:last-child{border-bottom:0}.big-event:nth-child(odd){border-right:0}
.competition-cell{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:7px;border-right:1px solid #183044;padding:10px 8px;color:#dce8f5;font-size:11px;text-align:center;font-weight:850;text-transform:uppercase;letter-spacing:.35px}
.competition-icon{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#0d1c29;border:1px solid #27455f;font-size:16px}
.match-cell{display:grid;grid-template-columns:72px 1fr;align-items:center;border-right:1px solid #183044}
.match-timebox{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-right:1px solid #183044;height:100%;font-weight:900}.match-timebox b{font-size:15px}.match-timebox small{color:#8ea1b7;font-size:11px}
.teams-wrap{display:grid;grid-template-columns:1fr 38px 1fr;align-items:center;gap:14px;padding:10px 12px}.team-side{display:flex;align-items:center;gap:10px;font-weight:900;min-width:0}.team-side.away{justify-content:flex-end;text-align:right}.team-badge{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#173753,#0a1724);border:1px solid #2a4b67;color:#fff;font-size:12px;font-weight:950;flex:0 0 auto}.vs-pill{width:34px;height:28px;border-radius:10px;background:#122236;border:1px solid #213b53;display:grid;place-items:center;color:#a9b8c8;font-size:11px;font-weight:900}
.odds-cell{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:center;padding:9px 12px;border-right:1px solid #183044}.odd-box{display:flex;flex-direction:column;align-items:center;gap:5px}.odd-box span{font-size:10px;color:#8fa2b8}.odd-box b{display:grid;place-items:center;min-width:66px;height:38px;border-radius:11px;background:#0f2031;border:1px solid #213d56;font-size:17px}
.action-cell{display:flex;align-items:center;gap:10px;padding:14px 16px}.action-cell .btn{white-space:nowrap}.bigGenerate{background:linear-gradient(135deg,#116fff,#16afe8)!important;border:0!important;color:#fff!important;box-shadow:0 8px 20px rgba(17,111,255,.18)!important}.bigMarkets{border:1px solid #1a9d74!important;color:#34d5a1!important;background:#081712!important}
.markets-box{display:none;grid-column:1/-1;margin:0 16px 14px;padding:14px;border-radius:12px;background:#07101a;border:1px solid #1d3448}.markets-box.open{display:block}
.variant-grid{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 16px 16px}.variant-card{border:1px solid #223a4f;border-radius:14px;padding:13px;background:#0a131d}.variant-card h4{margin:0 0 8px;color:#e9f4fb}
@media(max-width:1100px){.biggames-toolbar{grid-template-columns:1fr 1fr 1fr}.big-event{grid-template-columns:120px 1fr}.odds-cell,.action-cell{grid-column:2}.odds-cell{border-top:1px solid #183044}.action-cell{justify-content:flex-end}.competition-cell{grid-row:1/4}}
@media(max-width:820px){.generator{grid-template-columns:1fr 1fr}.grid,.report-head,.matches,.monthly-overview,.variant-grid{grid-template-columns:1fr}.biggames-toolbar{grid-template-columns:1fr 1fr}.biggames-hero-ref{min-height:230px;padding:24px}.biggames-heading{font-size:38px}.big-event{grid-template-columns:1fr}.competition-cell,.match-cell,.odds-cell{border-right:0}.competition-cell{grid-row:auto;align-items:flex-start;flex-direction:row;justify-content:flex-start}.odds-cell,.action-cell{grid-column:auto}.teams-wrap{grid-template-columns:1fr 34px 1fr}.match:nth-child(odd){border-right:0}.hero-title{font-size:28px}}
@media(max-width:540px){.shell{padding:0 12px 50px}.tabs{margin:0 -12px;padding:10px 12px;overflow:auto}.tab{padding:10px 13px;font-size:13px}.biggames-hero-ref{margin:0 -12px 12px;padding:18px 16px;min-height:210px}.biggames-heading{font-size:34px}.biggames-toolbar{grid-template-columns:1fr;padding:10px}.generator{grid-template-columns:1fr}.report-toolbar{align-items:flex-start;flex-direction:column}.action-cell{flex-direction:column;align-items:stretch}.action-cell .btn{width:100%}}

<body>
<div class="shell">
<header>
  <div class="brandline">
    <div class="logo">BNP</div>
    <div><h1>Sports Content Hub</h1><div class="sub">Content studio + daily sportsbook report</div></div>
  </div>
  <div class="status">● Live Betandplay data</div>
</header>

<div class="tabs">
  <button class="tab active" data-tab="studio">Content Studio</button>
<button class="tab" data-tab="biggames">Big Games</button>
</div>

<section id="studio" class="panel active">
  <div class="searchbox">
    <input id="teamSearch" type="search" placeholder="Search a team or player... e.g. Liverpool, Inter, Alcaraz">
    <button id="searchBtn" class="btn primary">🔎 Search match</button>
  </div>
  <div id="searchResults" class="search-results"></div>
  <div class="generator">
    <select id="tournament">
      <option value="all">All tournaments / Best available</option>
      <optgroup label="UEFA">
        <option value="champions">UEFA Champions League</option>
        <option value="europa">UEFA Europa League</option>
        <option value="conference">UEFA Conference League</option>
        <option value="nations">UEFA Nations League</option>
      </optgroup>
      <optgroup label="Top leagues">
        <option value="premier">Premier League</option><option value="bundesliga">Bundesliga</option>
        <option value="seriea">Serie A</option><option value="laliga">LaLiga</option><option value="ligue1">Ligue 1</option>
      </optgroup>
      <optgroup label="Cups">
        <option value="facup">FA Cup</option><option value="carabao">Carabao Cup</option><option value="dfbpokal">DFB-Pokal</option>
      </optgroup>
    </select>
    <select id="contentType">
      <option value="match">Match Spotlight</option><option value="tournament">Tournament Preview</option>
      <option value="acca">Tournament ACCA</option><option value="picks">Today's Picks</option><option value="weekend">Weekend Preview</option>
    </select>
    <select id="count"><option value="1">1 post</option><option value="3" selected>3 posts</option><option value="5">5 posts</option></select>
    <button id="generate" class="btn primary">✨ Generate content</button>
  </div>
  <div id="grid" class="grid"><div class="empty">Choose the tournament and content format you want to create.</div></div>
</section>

<section id="biggames" class="panel">
  <div class="biggames-hero-ref">
    <div class="biggames-copy">
      <div class="biggames-kicker">UPCOMING</div>
      <h2 class="biggames-heading">BIG <span>GAMES</span></h2>
      <div class="biggames-sub">Top teams. Major competitions. Ready for your content.</div>
      <div class="biggames-sportnav">
        <button class="sportnav-btn active" data-sport="soccer">⚽ Football</button>
        <button class="sportnav-btn" data-sport="tennis">◉ Tennis</button>
        <button class="sportnav-btn" data-sport="basketball">◉ Basketball</button>
      </div>
    </div>
  </div>

  <div class="biggames-toolbar">
    <input id="bigSearch" class="big-search" type="search" placeholder="⌕  Search team, player or competition...">
    <select id="bigRange" class="big-filter"><option value="30">▣ Next 30 days</option><option value="14">Next 14 days</option><option value="7">Next 7 days</option></select>
    <select id="bigCompetition" class="big-filter"><option value="all">🏆 All competitions</option></select>
    <select id="bigCountry" class="big-filter"><option value="all">◉ All countries</option></select>
    <button id="clearBigFilters" class="btn reset-blue">↻ Reset filters</button>
  </div>

  <select id="bigSport" style="display:none"><option value="soccer">Football</option><option value="tennis">Tennis</option><option value="basketball">Basketball</option></select>
  <select id="bigTeam" style="display:none"><option value="all">All teams / players</option></select>
  <input id="bigDate" type="hidden">

  <div id="bigGamesRoot"><div class="empty">Open this tab to load upcoming big games.</div></div>
</section>
</div>

<script>
const grid=document.getElementById("grid");
const btn=document.getElementById("generate");
const searchInput=document.getElementById("teamSearch");
const searchBtn=document.getElementById("searchBtn");
const searchResults=document.getElementById("searchResults");
const bigGamesRoot=document.getElementById("bigGamesRoot");
let currentPosts=[];
let bigEvents=[];

function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll(String.fromCharCode(34),"&quot;").replaceAll("'","&#39;");}

function renderCopyHtml(value){
  const raw=String(value??"");
  return raw.split("\n").map(line=>{
    let safe=esc(line);
    safe=safe.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");

    const trimmed=line.trim();
    if(!trimmed) return '<div style="height:8px"></div>';

    if(/^(MAIN ODDS|OTHER MARKETS|TODAY'S PICK|OUR PICK|MORE BETTING OPTIONS|LATEST ODDS|OUR ANGLE)$/i.test(trimmed.replace(/[*:]/g,"").trim())){
      return '<span class="copy-heading">'+safe+'</span>';
    }

    if(trimmed.startsWith("• ") || trimmed.startsWith("↳ ")){
      return '<span class="copy-bullet">'+safe+'</span>';
    }

    if(trimmed.startsWith("👉")){
      return '<span class="copy-cta">'+safe+'</span>';
    }

    return '<div>'+safe+'</div>';
  }).join("");
}

document.querySelectorAll(".tab").forEach(tab=>tab.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
  tab.classList.add("active");
  document.getElementById(tab.dataset.tab).classList.add("active");
  if(tab.dataset.tab==="biggames" && !bigGamesRoot.dataset.loaded) loadBigGames();
});

async function searchMatches(){
  const q=searchInput.value.trim();
  if(q.length<2){
    searchResults.innerHTML='<div class="empty">Type at least 2 characters.</div>';
    return;
  }

  const old=searchBtn.textContent;
  searchBtn.textContent="Searching…";
  searchBtn.disabled=true;

  try{
    const r=await fetch("/api/search-matches?q="+encodeURIComponent(q),{cache:"no-store"});
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||"search_failed");

    const matches=d.matches||[];
    if(!matches.length){
      searchResults.innerHTML='<div class="empty">No upcoming matches found for "'+esc(q)+'".</div>';
      return;
    }

    searchResults.innerHTML=matches.map(m=>
      '<div class="search-result">'+
        '<div class="search-main">'+
          '<div class="search-title">'+esc(m.title)+'</div>'+
          '<div class="search-meta">'+esc(m.competition)+' · '+esc(m.time)+' · '+esc(m.sport||"Sport")+'</div>'+
        '</div>'+
        '<button class="btn primary generateMatchPost" data-match-id="'+esc(m.id)+'">Generate post</button>'+
      '</div>'
    ).join("");

    document.querySelectorAll(".generateMatchPost").forEach(el=>el.onclick=async()=>{
      const original=el.textContent;
      el.textContent="Generating…";
      el.disabled=true;
      try{
        const rr=await fetch("/api/generate-from-match",{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({matchId:el.dataset.matchId})
        });
        const dd=await rr.json();
        if(!rr.ok) throw new Error(dd.error||"generation_failed");
        renderPosts([dd.post]);
        window.scrollTo({top:grid.offsetTop-80,behavior:"smooth"});
      }catch(e){
        searchResults.insertAdjacentHTML("afterbegin",'<div class="empty">Could not generate post: '+esc(e.message)+'</div>');
      }finally{
        el.textContent=original;
        el.disabled=false;
      }
    });
  }catch(e){
    searchResults.innerHTML='<div class="empty">Search failed: '+esc(e.message)+'</div>';
  }finally{
    searchBtn.textContent=old;
    searchBtn.disabled=false;
  }
}

searchBtn.onclick=searchMatches;
searchInput.addEventListener("keydown",e=>{if(e.key==="Enter") searchMatches();});

function renderPosts(posts){
  currentPosts=posts;
  if(!posts.length){grid.innerHTML='<div class="empty">No suitable events were found for that selection.</div>';return;}
  grid.innerHTML=posts.map((p,index)=>{
    const odds=(p.odds||[]).map(o=>'<span class="odd">'+esc(o.label)+' <b>'+esc(o.value)+'</b></span>').join("");
    return '<article class="card"><div class="top"><span class="pill">'+esc(p.contentType||"Content")+'</span><span class="pill">'+esc(p.competition||"")+'</span><span class="pill">'+esc(p.time||"")+'</span></div>'+
      '<div class="title">'+esc(p.title||"")+'</div><div class="odds">'+odds+'</div><div class="copy">'+renderCopyHtml(p.copy||"")+'</div>'+
      '<div class="actions"><button class="btn primary" data-copy="'+index+'">Copy post</button></div></article>';
  }).join("");
  document.querySelectorAll("[data-copy]").forEach(el=>el.onclick=async()=>{
    const p=currentPosts[Number(el.dataset.copy)];
    await navigator.clipboard.writeText(p.copy||"");
    const old=el.textContent;el.textContent="Copied ✓";setTimeout(()=>el.textContent=old,1200);
  });
}

btn.onclick=async()=>{
  const old=btn.textContent;btn.textContent="Generating…";btn.disabled=true;
  try{
    const r=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
      tournamentKey:document.getElementById("tournament").value,
      contentType:document.getElementById("contentType").value,
      count:Number(document.getElementById("count").value||3),
      excludeGermany:true
    })});
    const d=await r.json();if(!r.ok)throw new Error(d.error||"generation_failed");renderPosts(d.posts||[]);
  }catch(e){grid.innerHTML='<div class="empty">Generation failed: '+esc(e.message)+'</div>';}
  finally{btn.textContent=old;btn.disabled=false;}
};

function fmtBigDate(iso){
  if(!iso)return "";
  return new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Malta",weekday:"short",day:"2-digit",month:"short"}).format(new Date(iso));
}

function dateInputValue(iso){
  if(!iso)return "";
  return new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Malta",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date(iso));
}

function uniqueSorted(values){return [...new Set(values.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b)));}

function populateBigFilters(){
  const competition=document.getElementById("bigCompetition"), team=document.getElementById("bigTeam"), country=document.getElementById("bigCountry");
  const current={competition:competition.value,team:team.value,country:country.value};
  competition.innerHTML='<option value="all">All competitions</option>'+uniqueSorted(bigEvents.map(e=>e.competition)).map(v=>'<option>'+esc(v)+'</option>').join("");
  team.innerHTML='<option value="all">All teams / players</option>'+uniqueSorted(bigEvents.flatMap(e=>e.teamNames||[])).map(v=>'<option>'+esc(v)+'</option>').join("");
  country.innerHTML='<option value="all">All countries</option>'+uniqueSorted(bigEvents.map(e=>e.country)).map(v=>'<option>'+esc(v)+'</option>').join("");
  if([...competition.options].some(o=>o.value===current.competition))competition.value=current.competition;
  if([...team.options].some(o=>o.value===current.team))team.value=current.team;
  if([...country.options].some(o=>o.value===current.country))country.value=current.country;
}

function filteredBigEvents(){
  const sport=document.getElementById("bigSport").value;
  const competition=document.getElementById("bigCompetition").value;
  const country=document.getElementById("bigCountry").value;
  const q=(document.getElementById("bigSearch").value||"").trim().toLowerCase();
  const range=Number(document.getElementById("bigRange").value||30);
  const now=Date.now(), max=now+range*24*60*60*1000;
  return bigEvents.filter(e=>{
    const when=new Date(e.startTime||0).getTime();
    const hay=[e.title,e.competition,e.country,...(e.teamNames||[])].filter(Boolean).join(" ").toLowerCase();
    return (e.sportKey||"").toLowerCase()===sport &&
      (competition==="all" || e.competition===competition) &&
      (country==="all" || e.country===country) &&
      (!q || hay.includes(q)) &&
      when>=now && when<=max;
  });
}

function renderBigGames(){
  const events=filteredBigEvents();
  if(!events.length){bigGamesRoot.innerHTML='<div class="empty">No big games match these filters.</div>';return;}

  const byDay=new Map();
  for(const e of events){
    const key=dateInputValue(e.startTime)||"unknown";
    if(!byDay.has(key,))byDay.set(key,[]);
    byDay.get(key).push(e);
  }

  bigGamesRoot.innerHTML=[...byDay.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([date,items])=>{
    const comps=new Map();
    for(const e of items){if(!comps.has(e.competition))comps.set(e.competition,[]);comps.get(e.competition).push(e);}
    const compHtml=[...comps.entries()].map(([comp,list])=>
      '<div class="big-competition"><div class="big-event-list">'+
      list.map(e=>{
        const odds=(e.odds||[]).slice(0,3);
        const teams=(e.teamNames||[]).slice(0,2);
        const t1=teams[0]||e.title.split(" vs ")[0]||"Team 1", t2=teams[1]||e.title.split(" vs ")[1]||"Team 2";
        const initials=n=>String(n).split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase();
        const logoFor=n=>((e.teamLogos||[]).find(x=>x.name===n)||{}).url||"";
        const logoHtml=n=>logoFor(n)?'<img class="team-logo-img" src="'+esc(logoFor(n))+'" alt="">':esc(initials(n));
        const competitionLogo=e.competitionLogo?'<img class="competition-logo-img" src="'+esc(e.competitionLogo)+'" alt="">':'⚽';
        const timeMatch=(e.time||"").match(/(\d{2}:\d{2})/); const tm=timeMatch?timeMatch[1]:"--:--";
        return '<div class="big-event">'+
          '<div class="competition-cell"><div class="competition-icon">'+competitionLogo+'</div><div>'+esc(e.competition)+'</div></div>'+
          '<div class="match-cell"><div class="match-timebox"><b>'+esc(tm)+'</b><small>CEST</small></div><div class="teams-wrap"><div class="team-side"><span class="team-badge">'+logoHtml(t1)+'</span><span>'+esc(t1)+'</span></div><div class="vs-pill">VS</div><div class="team-side away"><span>'+esc(t2)+'</span><span class="team-badge">'+logoHtml(t2)+'</span></div></div></div>'+
          '<div class="odds-cell">'+[0,1,2].map(i=>{const o=odds[i];return '<div class="odd-box"><span>'+(i===0?'1':i===1?'X':'2')+'</span><b>'+esc(o?.value||'—')+'</b></div>';}).join("")+'</div>'+
          '<div class="action-cell"><button class="btn bigMarkets" data-id="'+esc(e.id)+'">▥ More markets</button><button class="btn primary bigGenerate" data-id="'+esc(e.id)+'">✎ Generate 3 posts</button></div>'+
          '<div id="markets-'+esc(e.id)+'" class="markets-box"></div>'+
          '<div id="variants-'+esc(e.id)+'"></div>'+
        '</div>';
      }).join("")+'</div></div>'
    ).join("");
    return '<section class="big-day"><div class="big-day-title"><h3>'+esc(fmtBigDate(items[0]?.startTime))+'</h3><span class="pill">'+items.length+' events</span></div>'+compHtml+'</section>';
  }).join("");

  document.querySelectorAll(".bigMarkets").forEach(btn=>btn.onclick=async()=>{
    const box=document.getElementById("markets-"+btn.dataset.id);
    if(box.dataset.loaded){box.classList.toggle("open");return;}
    btn.textContent="Loading…";btn.disabled=true;
    try{
      const r=await fetch("/api/match-markets/"+encodeURIComponent(btn.dataset.id),{cache:"no-store"});
      const d=await r.json();if(!r.ok)throw new Error(d.error||"markets_failed");
      box.innerHTML=(d.options||[]).length?(d.options||[]).map(o=>'<div class="copy-bullet">• '+esc(o.market)+': '+esc(o.label)+' @ <strong>'+esc(o.value)+'</strong></div>').join(""):'No additional markets available.';
      box.dataset.loaded="1";box.classList.add("open");
    }catch(e){box.innerHTML='Could not load markets: '+esc(e.message);box.classList.add("open");}
    finally{btn.textContent="More markets";btn.disabled=false;}
  });

  document.querySelectorAll(".bigGenerate").forEach(btn=>btn.onclick=async()=>{
    const root=document.getElementById("variants-"+btn.dataset.id);
    btn.textContent="Generating…";btn.disabled=true;
    try{
      const r=await fetch("/api/generate-variants",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({matchId:btn.dataset.id})});
      const d=await r.json();if(!r.ok)throw new Error(d.error||"generation_failed");
      root.innerHTML='<div class="variant-grid">'+(d.variants||[]).map((v,i)=>'<div class="variant-card"><h4>'+esc(v.contentType||("Option "+(i+1)))+'</h4><div class="copy">'+renderCopyHtml(v.copy||"")+'</div><button class="btn primary copyVariant" data-copytext="'+encodeURIComponent(v.copy||"")+'" style="margin-top:10px">Copy post</button></div>').join("")+'</div>';
      root.querySelectorAll(".copyVariant").forEach(el=>el.onclick=async()=>{await navigator.clipboard.writeText(decodeURIComponent(el.dataset.copytext||""));const old=el.textContent;el.textContent="Copied ✓";setTimeout(()=>el.textContent=old,1200);});
    }catch(e){root.innerHTML='<div class="empty">Could not generate posts: '+esc(e.message)+'</div>';}
    finally{btn.textContent="Generate 3 posts";btn.disabled=false;}
  });
}

async function loadBigGames(){
  bigGamesRoot.dataset.loaded="1";
  bigGamesRoot.innerHTML='<div class="empty">Loading upcoming big games from Betandplay…</div>';
  try{
    const r=await fetch("/api/big-events",{cache:"no-store"});
    const d=await r.json();if(!r.ok)throw new Error(d.error||"big_games_failed");
    bigEvents=d.events||[];
    populateBigFilters();renderBigGames();
  }catch(e){bigGamesRoot.innerHTML='<div class="empty">Could not load big games: '+esc(e.message)+'</div>';}
}

["bigCompetition","bigCountry","bigRange"].forEach(id=>document.getElementById(id)?.addEventListener("change",renderBigGames));
document.getElementById("bigSearch")?.addEventListener("input",renderBigGames);
document.querySelectorAll(".sportnav-btn").forEach(btn=>btn.onclick=()=>{
  document.querySelectorAll(".sportnav-btn").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById("bigSport").value=btn.dataset.sport;
  renderBigGames();
});
document.getElementById("clearBigFilters").onclick=()=>{
  document.getElementById("bigSport").value="soccer";
  document.getElementById("bigCompetition").value="all";
  document.getElementById("bigTeam").value="all";
  document.getElementById("bigCountry").value="all";
  document.getElementById("bigRange").value="30";
  document.getElementById("bigSearch").value="";
  document.querySelectorAll(".sportnav-btn").forEach(x=>x.classList.toggle("active",x.dataset.sport==="soccer"));
  renderBigGames();
};

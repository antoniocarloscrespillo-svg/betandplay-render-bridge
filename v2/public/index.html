<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Betandplay Sports Content Hub V2</title>
<style>
:root{
  --bg:#07090e;--panel:#11151d;--panel2:#171c26;--text:#f5f7fb;--muted:#95a0b4;
  --purple:#7c5cff;--blue:#278cff;--cyan:#18c8d8;--green:#32d583;--amber:#f7b84b;
  --red:#ff5d6c;--pink:#e96dff;--line:#252c39;
}
*{box-sizing:border-box}
body{margin:0;background:
radial-gradient(circle at 88% 0%,rgba(124,92,255,.19),transparent 26%),
radial-gradient(circle at 8% 18%,rgba(39,140,255,.12),transparent 24%),
var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
button,select{font:inherit}
.shell{max-width:1240px;margin:auto;padding:24px 18px 64px}
header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}
.brandline{display:flex;gap:14px;align-items:center}
.logo{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,var(--purple),var(--blue));display:grid;place-items:center;font-weight:900;box-shadow:0 12px 30px rgba(79,92,255,.3)}
h1{margin:0;font-size:28px;letter-spacing:-.6px}.sub{margin:5px 0 0;color:var(--muted);font-size:14px}
.status{font-size:12px;padding:8px 11px;border:1px solid rgba(50,213,131,.3);background:rgba(50,213,131,.08);color:#8ef0b7;border-radius:999px}
.tabs{display:flex;gap:8px;margin:0 0 18px}.tab{border:1px solid var(--line);background:#0d1118;color:#b6bfd0;padding:10px 14px;border-radius:12px;font-weight:800;cursor:pointer}.tab.active{color:#fff;background:linear-gradient(135deg,var(--purple),var(--blue));border-color:transparent}
.panel{display:none}.panel.active{display:block}
.generator{display:grid;grid-template-columns:2fr 2fr 1fr auto;gap:10px;background:linear-gradient(180deg,#171c26,#11151d);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:18px}
select,.btn{border:1px solid var(--line);background:#0d1219;color:var(--text);border-radius:12px;padding:12px 13px;font-weight:750}.btn{cursor:pointer}.primary{border:0;background:linear-gradient(135deg,var(--purple),var(--blue));box-shadow:0 8px 22px rgba(74,92,255,.22)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{background:linear-gradient(180deg,#171c26,#11151d);border:1px solid var(--line);border-radius:20px;padding:18px;overflow:hidden;position:relative}
.card:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--purple),var(--blue))}
.top{display:flex;justify-content:space-between;gap:9px;flex-wrap:wrap}.pill{font-size:11px;padding:7px 9px;border-radius:999px;background:#0c1118;border:1px solid var(--line);color:#c8cfdb}.title{font-size:20px;font-weight:850;margin:13px 0}.odds{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.odd{padding:8px 10px;border-radius:10px;background:#0b0f16;border:1px solid #2a3240;font-size:13px}.copy{white-space:pre-wrap;background:#0a0e14;border:1px solid var(--line);padding:14px;border-radius:14px;line-height:1.5;font-size:14px}.actions{display:flex;gap:10px;margin-top:14px}
.empty{padding:54px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px;grid-column:1/-1}
.report-head{display:grid;grid-template-columns:1.6fr .8fr;gap:16px;margin-bottom:16px}
.hero{min-height:220px;border:1px solid var(--line);border-radius:24px;padding:24px;background:
linear-gradient(145deg,rgba(124,92,255,.9),rgba(39,140,255,.62) 55%,rgba(24,200,216,.25)),
#11151d;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;position:relative}
.hero:after{content:"";position:absolute;width:230px;height:230px;border:35px solid rgba(255,255,255,.07);border-radius:50%;right:-55px;top:-65px}
.hero-kicker{font-size:12px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;opacity:.8}.hero-title{font-size:34px;line-height:1.02;font-weight:900;max-width:620px;letter-spacing:-1px}.hero-meta{display:flex;gap:8px;flex-wrap:wrap}.hero-chip{font-size:12px;padding:8px 10px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.16);border-radius:999px}
.side-stack{display:grid;grid-template-rows:1fr 1fr;gap:12px}.metric{border-radius:20px;padding:18px;border:1px solid var(--line);background:#11151d}.metric:nth-child(1){background:linear-gradient(135deg,rgba(50,213,131,.18),#11151d)}.metric:nth-child(2){background:linear-gradient(135deg,rgba(247,184,75,.17),#11151d)}.metric .big{font-size:32px;font-weight:900;margin-top:8px}.metric span{color:var(--muted);font-size:12px}
.report-toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:8px 0 16px}.report-title h2{margin:0;font-size:22px}.report-title p{margin:4px 0 0;color:var(--muted);font-size:13px}
.competitions{display:grid;gap:14px}.competition{border:1px solid var(--line);border-radius:20px;background:#10141b;overflow:hidden}.comp-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 17px;border-bottom:1px solid var(--line)}.comp-title{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:900}.dot{width:10px;height:10px;border-radius:50%}.matches{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0}.match{padding:15px 17px;border-bottom:1px solid #1d2430}.match:nth-child(odd){border-right:1px solid #1d2430}.match-name{font-weight:800;margin-bottom:7px}.match-time{font-size:12px;color:var(--muted);margin-bottom:10px}.mini-odds{display:flex;gap:6px;flex-wrap:wrap}.mini{font-size:11px;padding:6px 8px;border-radius:8px;background:#0a0f15;border:1px solid #26303d}
.c-champions .dot{background:var(--blue)}.c-europa .dot{background:var(--amber)}.c-conference .dot{background:var(--green)}.c-premier .dot{background:var(--pink)}.c-bundesliga .dot{background:var(--red)}.c-seriea .dot{background:var(--cyan)}.c-laliga .dot{background:#ff7a45}.c-ligue1 .dot{background:#8f7cff}.c-facup .dot{background:#58d6ff}.c-nations .dot{background:#f4d35e}.c-other .dot{background:#778297}
@media(max-width:820px){.generator{grid-template-columns:1fr 1fr}.grid,.report-head,.matches{grid-template-columns:1fr}.match:nth-child(odd){border-right:0}header{align-items:flex-start;flex-direction:column}.hero-title{font-size:28px}}
@media(max-width:540px){.generator{grid-template-columns:1fr}.tabs{overflow:auto}.report-toolbar{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="shell">
<header>
  <div class="brandline">
    <div class="logo">BNP</div>
    <div><h1>Sports Content Hub</h1><div class="sub">Content studio + daily sportsbook report</div></div>
  </div>
  <div class="status">● Live Betandplay data</div>
</header>

<div class="tabs">
  <button class="tab active" data-tab="studio">Content Studio</button>
  <button class="tab" data-tab="report">Reports</button>
</div>

<section id="studio" class="panel active">
  <div class="generator">
    <select id="tournament">
      <option value="all">All tournaments / Best available</option>
      <optgroup label="UEFA">
        <option value="champions">UEFA Champions League</option>
        <option value="europa">UEFA Europa League</option>
        <option value="conference">UEFA Conference League</option>
        <option value="nations">UEFA Nations League</option>
      </optgroup>
      <optgroup label="Top leagues">
        <option value="premier">Premier League</option><option value="bundesliga">Bundesliga</option>
        <option value="seriea">Serie A</option><option value="laliga">LaLiga</option><option value="ligue1">Ligue 1</option>
      </optgroup>
      <optgroup label="Cups">
        <option value="facup">FA Cup</option><option value="carabao">Carabao Cup</option><option value="dfbpokal">DFB-Pokal</option>
      </optgroup>
    </select>
    <select id="contentType">
      <option value="match">Match Spotlight</option><option value="tournament">Tournament Preview</option>
      <option value="acca">Tournament ACCA</option><option value="picks">Today's Picks</option><option value="weekend">Weekend Preview</option>
    </select>
    <select id="count"><option value="1">1 post</option><option value="3" selected>3 posts</option><option value="5">5 posts</option></select>
    <button id="generate" class="btn primary">✨ Generate content</button>
  </div>
  <div id="grid" class="grid"><div class="empty">Choose the tournament and content format you want to create.</div></div>
</section>

<section id="report" class="panel">
  <div class="report-toolbar" style="margin-top:0">
    <div class="report-title">
      <h2>Sports Reports</h2>
      <p>Generate API-based daily, weekly or monthly overviews.</p>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn primary reportPeriod" data-period="daily">Daily Report</button>
      <button class="btn reportPeriod" data-period="weekly">Weekly Report</button>
      <button class="btn reportPeriod" data-period="monthly">Monthly Report</button>
    </div>
  </div>
  <div id="reportRoot"><div class="empty">Choose a report period.</div></div>
</section>
</div>

<script>
const grid=document.getElementById("grid");
const btn=document.getElementById("generate");
const reportRoot=document.getElementById("reportRoot");
let currentPosts=[];

function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll(String.fromCharCode(34),"&quot;").replaceAll("'","&#39;");}

document.querySelectorAll(".tab").forEach(tab=>tab.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
  tab.classList.add("active");
  document.getElementById(tab.dataset.tab).classList.add("active");
  if(tab.dataset.tab==="report" && !reportRoot.dataset.loaded) loadReport("daily",false);
});

function renderPosts(posts){
  currentPosts=posts;
  if(!posts.length){grid.innerHTML='<div class="empty">No suitable events were found for that selection.</div>';return;}
  grid.innerHTML=posts.map((p,index)=>{
    const odds=(p.odds||[]).map(o=>'<span class="odd">'+esc(o.label)+' <b>'+esc(o.value)+'</b></span>').join("");
    return '<article class="card"><div class="top"><span class="pill">'+esc(p.contentType||"Content")+'</span><span class="pill">'+esc(p.competition||"")+'</span><span class="pill">'+esc(p.time||"")+'</span></div>'+
      '<div class="title">'+esc(p.title||"")+'</div><div class="odds">'+odds+'</div><div class="copy">'+esc(p.copy||"")+'</div>'+
      '<div class="actions"><button class="btn primary" data-copy="'+index+'">Copy post</button></div></article>';
  }).join("");
  document.querySelectorAll("[data-copy]").forEach(el=>el.onclick=async()=>{
    const p=currentPosts[Number(el.dataset.copy)];
    await navigator.clipboard.writeText(p.copy||"");
    const old=el.textContent;el.textContent="Copied ✓";setTimeout(()=>el.textContent=old,1200);
  });
}

btn.onclick=async()=>{
  const old=btn.textContent;btn.textContent="Generating…";btn.disabled=true;
  try{
    const r=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
      tournamentKey:document.getElementById("tournament").value,
      contentType:document.getElementById("contentType").value,
      count:Number(document.getElementById("count").value||3),
      excludeGermany:true
    })});
    const d=await r.json();if(!r.ok)throw new Error(d.error||"generation_failed");renderPosts(d.posts||[]);
  }catch(e){grid.innerHTML='<div class="empty">Generation failed: '+esc(e.message)+'</div>';}
  finally{btn.textContent=old;btn.disabled=false;}
};

function reportCacheKey(period){
  const date=new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Malta",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
  return "bnp_"+period+"_report_"+date;
}

async function loadReport(period="daily",force=false){
  document.querySelectorAll(".reportPeriod").forEach(x=>x.classList.toggle("primary",x.dataset.period===period));
  reportRoot.dataset.loaded="1";

  if(!force){
    const cached=localStorage.getItem(reportCacheKey(period));
    if(cached){try{return renderReport(JSON.parse(cached),period);}catch{}}
  }

  const label=period==="monthly"?"next 30 days":period==="weekly"?"next 7 days":"today";
  reportRoot.innerHTML='<div class="empty">Building the '+label+' report from Betandplay API…</div>';

  try{
    const r=await fetch("/api/report?period="+encodeURIComponent(period),{cache:"no-store"});
    const d=await r.json();if(!r.ok)throw new Error(d.error||"report_failed");
    localStorage.setItem(reportCacheKey(period),JSON.stringify(d.report));
    renderReport(d.report,period);
  }catch(e){
    reportRoot.innerHTML='<div class="empty">'+esc(period[0].toUpperCase()+period.slice(1))+' report failed: '+esc(e.message)+'</div>';
  }
}

function renderReport(report,period="daily"){
  const highlight=report.highlights?.[0];
  const sections=report.sections||[];
  const total=sections.reduce((n,s)=>n+s.items.length,0);
  const comps=sections.length;

  const hero=highlight
    ? '<div class="hero"><div><div class="hero-kicker">Match of the day</div><div class="hero-title">'+esc(highlight.title)+'</div></div><div class="hero-meta"><span class="hero-chip">'+esc(highlight.competition)+'</span><span class="hero-chip">'+esc(highlight.time)+'</span></div></div>'
    : '<div class="hero"><div class="hero-title">Daily Sports Highlights</div></div>';

  const body=sections.map(s=>'<section class="competition c-'+esc(s.key)+'"><div class="comp-head"><div class="comp-title"><span class="dot"></span>'+esc(s.competition)+'</div><span class="pill">'+s.items.length+' events</span></div><div class="matches">'+
    s.items.map(m=>'<div class="match"><div class="match-name">'+esc(m.title)+'</div><div class="match-time">'+esc(m.time)+'</div><div class="mini-odds">'+
      (m.featuredOdds||[]).map(o=>'<span class="mini">'+esc(o.label)+' <b>'+esc(o.value)+'</b></span>').join("")+
      '</div></div>').join("")+'</div></section>').join("");

  reportRoot.innerHTML='<div class="report-head">'+hero+'<div class="side-stack"><div class="metric"><span>EVENTS TODAY</span><div class="big">'+total+'</div></div><div class="metric"><span>COMPETITIONS</span><div class="big">'+comps+'</div></div></div></div>'+
    '<div class="report-toolbar"><div class="report-title"><h2>'+esc(report.title)+' · '+esc(report.dateLabel)+'</h2><p>'+esc(report.intro)+'</p></div><button id="refreshReport" class="btn">↻ Refresh report</button></div>'+
    '<div class="competitions">'+(body||'<div class="empty">No major events found.</div>')+'</div>';

  document.getElementById("refreshReport").onclick=()=>loadReport(period,true);
}

document.querySelectorAll(".reportPeriod").forEach(btn=>btn.onclick=()=>loadReport(btn.dataset.period,false));
</script>
</body>
</html>
